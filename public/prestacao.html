<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prestação de Contas — Condomínio Ville</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#f0fdf4', 100:'#dcfce7', 300:'#86efac', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 800:'#166534', 900:'#14532d' }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    .card { @apply bg-white rounded-xl shadow-sm border border-gray-100 p-5; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

<header class="bg-brand-800 text-white shadow-lg">
  <div class="max-w-3xl mx-auto px-4 py-5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-xl">📊</div>
      <div>
        <h1 class="text-xl font-bold leading-tight">Prestação de Contas</h1>
        <p class="text-brand-100 text-xs">Condomínio Ville — Asfaltamento</p>
      </div>
    </div>
    <a href="/" class="text-sm text-brand-100 hover:text-white">← Início</a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
  <div id="loading" class="text-center py-10 text-gray-400">Carregando...</div>
  <div id="content" class="hidden space-y-6">

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3">
      <div class="card text-center py-4">
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Arrecadado</p>
        <p id="total-paid" class="text-xl font-bold text-brand-700"></p>
      </div>
      <div class="card text-center py-4">
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Despesas</p>
        <p id="total-expenses" class="text-xl font-bold text-red-600"></p>
      </div>
      <div class="card text-center py-4">
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Saldo</p>
        <p id="balance" class="text-xl font-bold"></p>
      </div>
    </div>

    <div id="pending-banner" class="hidden bg-yellow-50 border border-yellow-200 rounded-xl px-4 py-3">
      <p id="pending-text" class="text-yellow-700 text-sm"></p>
    </div>

    <!-- Monthly breakdown -->
    <div class="card">
      <h2 class="font-bold text-gray-800 mb-5 text-lg">Arrecadação e Gastos por Mês</h2>
      <div id="monthly-list" class="space-y-4"></div>
    </div>

    <!-- Expenses list -->
    <div class="card">
      <h2 class="font-bold text-gray-800 mb-4 text-lg">Gastos Realizados com a Obra</h2>
      <div id="expenses-list"></div>
    </div>

    <div class="bg-brand-50 border border-brand-200 rounded-xl p-4 text-center text-sm text-brand-700">
      <p>Esta prestação de contas é atualizada automaticamente pelo sistema.</p>
      <p class="text-brand-500 text-xs mt-1">Contribuições mínimas de R$ 20,00 até o dia 10 de cada mês.</p>
    </div>
  </div>
</main>

<script>
  const fmt = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
  const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('pt-BR');
  function fmtMonth(ym) {
    const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const [y, m] = ym.split('-');
    return `${months[parseInt(m)-1]}/${y}`;
  }

  async function init() {
    const res = await fetch('/api/public/prestacao');
    if (!res.ok) { document.getElementById('loading').textContent = 'Erro ao carregar dados.'; return; }
    const { stats, monthly, expenses } = await res.json();

    document.getElementById('total-paid').textContent = fmt(stats.totalPaid);
    document.getElementById('total-expenses').textContent = fmt(stats.totalExpenses);
    const bal = document.getElementById('balance');
    bal.textContent = fmt(stats.balance);
    bal.className = `text-xl font-bold ${stats.balance >= 0 ? 'text-brand-700' : 'text-red-600'}`;

    if (stats.totalPending > 0) {
      document.getElementById('pending-banner').classList.remove('hidden');
      document.getElementById('pending-text').innerHTML = `⏳ Mais <strong>${fmt(stats.totalPending)}</strong> aguardando confirmação (dinheiro em mãos).`;
    }

    // Monthly
    if (monthly.length === 0) {
      document.getElementById('monthly-list').innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Nenhum dado registrado ainda.</p>';
    } else {
      document.getElementById('monthly-list').innerHTML = monthly.map((m, i) => {
        const prevBalance = monthly[i + 1]?.running_balance ?? 0;
        return `
        <div class="border border-gray-100 rounded-xl overflow-hidden">
          <div class="bg-gray-50 px-4 py-3">
            <h3 class="font-bold text-gray-700">${fmtMonth(m.reference_month)}</h3>
          </div>
          <div class="px-4 py-3 space-y-2 text-sm">
            <div class="flex items-center justify-between text-gray-500">
              <span>Saldo do mês anterior</span>
              <span class="font-medium ${prevBalance >= 0 ? 'text-gray-600' : 'text-red-500'}">${fmt(prevBalance)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-brand-700">(+) Arrecadado no mês <span class="text-xs text-gray-400">(${m.contributing_lots} lotes)</span></span>
              <span class="font-semibold text-brand-700">${fmt(m.total_paid)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-red-600">(−) Despesas no mês</span>
              <span class="font-semibold text-red-600">${fmt(m.total_expenses)}</span>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-200">
              <span class="font-bold text-gray-800">Saldo final do mês</span>
              <span class="font-bold text-lg ${m.running_balance >= 0 ? 'text-brand-700' : 'text-red-600'}">${fmt(m.running_balance)}</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // Expenses
    if (expenses.length === 0) {
      document.getElementById('expenses-list').innerHTML = '<div class="text-center py-6"><p class="text-gray-400 text-sm">Nenhum gasto registrado ainda.</p></div>';
    } else {
      const total = expenses.reduce((s, e) => s + e.amount, 0);
      document.getElementById('expenses-list').innerHTML = `
        <div class="space-y-2">${expenses.map(e => `
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg gap-3">
            <div class="min-w-0">
              <p class="font-medium text-gray-800 text-sm">${e.description}</p>
              <div class="flex items-center gap-2 mt-0.5 flex-wrap">
                <span class="text-xs text-gray-400">${fmtDate(e.expense_date)}</span>
                ${e.reference_month ? `<span class="text-xs text-brand-600">${fmtMonth(e.reference_month)}</span>` : ''}
                <span class="text-xs text-gray-400 capitalize bg-gray-200 px-2 py-0.5 rounded-full">${e.category}</span>
              </div>
              ${e.notes ? `<p class="text-xs text-gray-400 italic mt-0.5">${e.notes}</p>` : ''}
            </div>
            <span class="font-bold text-red-600 whitespace-nowrap">${fmt(e.amount)}</span>
          </div>`).join('')}
          <div class="flex justify-between items-center pt-3 border-t border-gray-200 font-bold">
            <span class="text-gray-700">Total gasto</span>
            <span class="text-red-600">${fmt(total)}</span>
          </div>
        </div>`;
    }

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  init();
</script>
</body>
</html>
